<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DJ Joshua Reid</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #000;
      color: #fff;
    }

    /* LEFT: Image section */
    .image-section {
      width: 70%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .image-section img {
      width: 50%;
      height: auto;
      display: block;
    }

    /* RIGHT: Navigation */
    .nav-section {
      width: 30%;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding-left: 1rem;
    }

    nav {
      display: flex;
      flex-direction: column;
      gap: 25px;
    }

    nav a {
      color: #fff;
      text-decoration: none;
      font-size: 2rem;
      letter-spacing: 2px;
    }

    nav a:hover {
      opacity: 0.7;
    }

    /* Responsive */
    @media (max-width: 900px) {
      body {
        flex-direction: column;
      }

      .image-section,
      .nav-section {
        width: 100%;
        height: 50vh;
      }

      nav a {
        font-size: 1.6rem;
      }
    }
  </style>
</head>
<body>
  <div class="image-section">
    <img src="index.jpg" alt="DJ Joshua Reid" />
  </div>

  <div class="nav-section">
    <nav>
      <a href="#home">Home</a>
      <a href="#bio">Biography</a>
      <a href="#mixes">DJ Mixes</a>
      <a href="#shows">Shows</a>
      <a href="#contact">Contact</a>
    </nav>
  </div>
</body>
</html>
